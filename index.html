<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Bitcoin Transaction Viz</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
<div id="app">

    <header class="app-header">
        <div class="header-left">
            <div class="header-icon">₿</div>
            <h1>Bitcoin Transaction Analysis</h1>
            <span id="header-badge" class="header-badge" style="display:none"></span>
        </div>
        <span id="header-tx-count" class="header-tx-count"></span>
    </header>

    <div class="dashboard">
        <aside class="sidebar">
             <div class="sidebar-resize-handle" id="sidebar-resize-handle"></div>

            <div class="sb-section">
                <div class="sb-label">View</div>
                <button id="toggle-btn" class="btn-switch"></button>
                <button id="toggle-btn-explorative" class="btn-switch">Explorative Flow</button>
                <button id="load-matrix-btn" class="btn-switch">Matrix View</button>
    

            </div>

            <div class="sb-section">
                <div class="sb-label">Day</div>
                <div id="dynamic-controls"></div>
            </div>

            <div class="sb-filters" id="filter-controls-container"></div>

            <div class="sb-footer">
                <span class="tx-count-label">TX found: <b id="tx-count-val">—</b></span>
                <button id="apply-filters-btn" class="btn-apply" style="display:none">Apply</button>
                <button id="export-csv-btn">⬇ Export CSV</button>
            </div>

        </aside>

        <main id="viz-container" class="viz-container">
            <div class="viz-toolbar" id="viz-toolbar">
                <span class="viz-chip chip-red">● &gt;500 BTC</span>
                <span class="viz-chip chip-amber">● 100–500 BTC</span>
                <span class="viz-chip chip-green">● &lt;100 BTC</span>
                <span class="viz-hint">Zoom · Pan · Click for details</span>
            </div>
            <div id="chart-area"></div>
        </main>

    </div>

</div>

<div id="transaction-details-panel" class="details-panel">
    <div class="panel-header">
        <h3>Transaction Details</h3>
        <button id="close-panel" class="close-btn"></button>
    </div>
    <div id="panel-content" class="panel-content">
        <p style="color:#555;">Select a transaction to see details.</p>
    </div>
</div>


<script src="js/chartDotPlot.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="js/flowChart.js"></script>
<script src="js/explorativeFlowChart.js"></script>
<script src="js/explorativeFlow.js"></script>
<script src="js/filterManager.js"></script>
<script src="js/clusterManager.js"></script>
<script src="js/peelingChainDetection.js"></script>
<script src="js/matrixChart.js"></script>
<script src="js/Peelingchainorigin.js"></script>
 <script src="js/sidebarResize.js"></script>
<script src="js/main.js"></script>

<script>
    document.getElementById('close-panel').addEventListener('click', () => {
        document.getElementById('transaction-details-panel').classList.remove('open');
    });
</script>

</body>
</html>
